<section class="hero">

  <div class="hero-content">

    <div class="status">
      <span class="status-dot"></span>
      Open to frontend opportunities
    </div>

    <p class="intro">
      Hi, I'm Varsha.
    </p>

    <h1>
      I build scalable
      <span>frontend experiences.</span>
    </h1>

    <p class="description">
      Frontend Engineer with around 5 years of experience specializing
      in Angular, TypeScript, and enterprise web applications.
    </p>

    <div class="hero-actions">

      <a
        href="#projects"
        class="primary-button"
      >
        View My Work
        <span>↓</span>
      </a>

      <a
        [href]="profile.resume"
        class="secondary-button"
        download
      >
        Download Resume
      </a>

    </div>

    <div class="hero-footer">

      <div class="social-links">

        <a
          [href]="profile.socialLinks.linkedin"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn ↗
        </a>

        <a
          [href]="profile.socialLinks.github"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub ↗
        </a>

      </div>

      <p class="specialization">
        Angular · TypeScript · RxJS
      </p>

    </div>

  </div>

</section>
