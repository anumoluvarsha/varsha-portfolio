<section class="contact" id="contact">

  <app-section-header
    number="04"
    title="Contact"
    [dark]="true"
  />

  <div class="contact-content">

    <div>

      <p class="availability">
        Open to opportunities
      </p>

      <h2>
        Have an opportunity
        <span>worth discussing?</span>
      </h2>

    </div>

    <div class="contact-info">

      <p>
        I'm interested in Senior Software Engineer and Angular-focused
        opportunities where I can build scalable products and AI-assisted
        application experiences.
      </p>

      <div class="contact-links">

        <a [href]="'mailto:' + profile.socialLinks.email">
          <span>Email me</span>
          <span>↗</span>
        </a>

        <a
          [href]="profile.socialLinks.linkedin"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>LinkedIn</span>
          <span>↗</span>
        </a>

        <a
          [href]="profile.socialLinks.github"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>GitHub</span>
          <span>↗</span>
        </a>

      </div>

    </div>

  </div>

</section>
